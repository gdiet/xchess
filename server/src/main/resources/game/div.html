<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #pixi { flex: 1; }
  </style>
</head>
<body>
  <p>top line</p>

  <div id="pixi"></div>

  <p>end line</p>
  <script src="https://github.com/pixijs/pixijs/releases/download/v8.12.0/pixi.js"></script>

  <script type="module">
    const parent = document.getElementById('pixi')
    const app = new PIXI.Application()
    await app.init({ background: '#1099bb', resizeTo: parent })
    parent.appendChild(app.canvas)
  </script>

</body>
</html>
