<!DOCTYPE html>
<html>
  <body>
    <h1>Game Starter</h1>
    <p>Board layout: <input id="boardLayout" value="standard" /></p>
    <p>Freeze time (milliseconds): <input id="freezeTime" value="10000" /></p>
    <button onclick="startGame()">Start game</button>

    <script>
      window.startGame = async function () {
        const boardLayout = document.getElementById("boardLayout").value;
        const freezeTime = document.getElementById("freezeTime").value;

        try {
          const r = await fetch("/api/games", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              boardLayout: "standard",
              freezeTimeMilliseconds: 10000,
            }),
          });
          if (!r.ok)
            throw new Error(
              r.status + " " + r.statusText + ": " + (await r.text())
            );
          const gameId = (await r.json()).gameId;
          console.log("Game created:", gameId);
          window.open(`/game.html?gameId=${gameId}`, "_blank");
        } catch (error) {
          console.error("Error creating game:", error);
        }
      };
    </script>
  </body>
</html>
